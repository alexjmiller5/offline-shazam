name: OfflineShazam
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
  configs:
    debug:
      ONLY_ACTIVE_ARCH: YES
      ENABLE_TESTABILITY: YES
targets:
  OfflineShazam:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexmiller.offline-shazam
        PRODUCT_NAME: OfflineShazam
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Offline Shazam
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: Record a short clip to identify music, including when offline.
        ITSAppUsesNonExemptEncryption: false
  OfflineShazamTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexmiller.offline-shazam.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: OfflineShazam
  OfflineShazamUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexmiller.offline-shazam.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: OfflineShazam
schemes:
  OfflineShazam:
    build:
      targets:
        OfflineShazam: all
        OfflineShazamTests: [test]
        OfflineShazamUITests: [test]
    test:
      targets: [OfflineShazamTests, OfflineShazamUITests]
