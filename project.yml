name: OfflineShazam
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    APP_BUNDLE_IDENTIFIER: com.alexmiller.offline-shazam
  configs:
    debug:
      ONLY_ACTIVE_ARCH: YES
      ENABLE_TESTABILITY: YES
targets:
  OfflineShazam:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER)
        PRODUCT_NAME: OfflineShazam
        PROVISIONING_PROFILE_SPECIFIER: $(IOS_APP_PROFILE)
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Offline Shazam
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: Record a short clip to identify music, including when offline.
        NSSupportsLiveActivities: true
        UIBackgroundModes: [audio]
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - target: OfflineShazamActivity
  OfflineShazamActivity:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER).activity
        PRODUCT_NAME: OfflineShazamActivity
        PROVISIONING_PROFILE_SPECIFIER: $(IOS_ACTIVITY_PROFILE)
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Song Capture
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  OfflineShazamTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER).tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: OfflineShazam
  OfflineShazamUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER).uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: OfflineShazam
schemes:
  OfflineShazam:
    build:
      targets:
        OfflineShazam: all
        OfflineShazamTests: [test]
        OfflineShazamUITests: [test]
    test:
      targets: [OfflineShazamTests, OfflineShazamUITests]
